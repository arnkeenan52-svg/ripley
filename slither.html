<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slither — Markus er ulækker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #0a0014;
    min-height: 100vh;
    font-family: 'VT323', monospace;
    color: #fff;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 20px 10px;
    min-height: 100vh;
  }

  .back {
    position: fixed;
    top: 20px; left: 20px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #000;
    background: #ff77a8;
    padding: 8px 14px;
    border-radius: 4px;
    text-decoration: none;
    z-index: 100;
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(18px, 4vw, 32px);
    margin-bottom: 6px;
    text-align: center;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ff77a8 0%, #ff004d 50%, #ffec27 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbow 4s linear infinite;
  }
  @keyframes rainbow { to { background-position: 200% center; } }

  .subtitle {
    font-size: 18px;
    color: #ff77a8;
    margin-bottom: 8px;
    letter-spacing: 4px;
    text-align: center;
  }

  .hud {
    display: flex;
    gap: 24px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    margin-bottom: 8px;
    color: #ff77a8;
  }
  .hud span { color: #fff; }

  canvas {
    background: #06000c;
    border: 3px solid #ff77a8;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(255,119,168,.5);
    display: block;
    max-width: 100%;
    height: auto;
    cursor: crosshair;
  }

  .controls {
    margin-top: 8px;
    font-size: 16px;
    color: #aaa;
    text-align: center;
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 50;
    font-family: 'Press Start 2P', monospace;
  }
  #overlay h2 {
    color: #ff77a8;
    font-size: 28px;
    margin-bottom: 16px;
    text-shadow: 0 0 20px #ff77a8;
  }
  #overlay p { color: #fff; font-size: 13px; margin-bottom: 20px; }
  #overlay button {
    background: #ff77a8;
    color: #000;
    border: none;
    padding: 14px 28px;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  #overlay button:hover { background: #ffec27; }

  .leaderboard {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #ff77a8;
    border-radius: 6px;
    padding: 10px 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #fff;
    z-index: 5;
  }
  .leaderboard h3 { color: #ff77a8; margin-bottom: 6px; font-size: 11px; }
  .leaderboard .row { margin: 3px 0; }
  .leaderboard .you { color: #ffec27; }
</style>
</head>
<body>

<a class="back" href="index.html">← ARCADE</a>

<h1>Markus er ulækker</h1>
<div class="subtitle">★ SLITHER ★</div>

<div class="hud">
  LENGTH: <span id="len">10</span>
  KILLS: <span id="kills">0</span>
  RANK: <span id="rank">-</span>
</div>

<canvas id="game" width="900" height="600"></canvas>

<div class="controls">Move mouse to steer — click/hold for boost</div>

<div class="leaderboard">
  <h3>LEADERBOARD</h3>
  <div id="lb"></div>
</div>

<div id="overlay">
  <h2>SLITHER</h2>
  <p>Eat food, kill bots, don't crash into snakes</p>
  <button id="startBtn">START</button>
</div>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const lenEl = document.getElementById('len');
const killsEl = document.getElementById('kills');
const rankEl = document.getElementById('rank');
const lbEl = document.getElementById('lb');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

const W = canvas.width;
const H = canvas.height;

// World bigger than viewport — camera follows player
const WORLD = 2400;

let mouseX = W / 2, mouseY = H / 2;
let boosting = false;

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
  mouseY = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener('mousedown', e => { boosting = true; e.preventDefault(); });
canvas.addEventListener('mouseup', () => { boosting = false; });
canvas.addEventListener('touchstart', e => {
  boosting = true;
  const t = e.touches[0];
  const r = canvas.getBoundingClientRect();
  mouseX = (t.clientX - r.left) * (W / r.width);
  mouseY = (t.clientY - r.top) * (H / r.height);
  e.preventDefault();
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  const t = e.touches[0];
  const r = canvas.getBoundingClientRect();
  mouseX = (t.clientX - r.left) * (W / r.width);
  mouseY = (t.clientY - r.top) * (H / r.height);
  e.preventDefault();
}, {passive: false});
canvas.addEventListener('touchend', () => { boosting = false; });

const COLORS = ['#ff004d', '#00e436', '#29adff', '#ffec27', '#ff8500', '#ff77a8', '#a8e6ff', '#c8ff00'];
const NAMES = ['Mads', 'Lukas', 'Frederik', 'Emil', 'Oliver', 'Magnus', 'Victor', 'Sebastian', 'William', 'Alexander', 'Noah', 'Felix', 'Anton', 'Jonas', 'Tobias'];

// Game state
let player, bots, food, particles, frame, kills, state;

function makeSnake(x, y, color, name, isPlayer = false) {
  const len = 10;
  const seg = [];
  for (let i = 0; i < len; i++) seg.push({ x: x - i * 4, y });
  return {
    seg,
    x, y,
    angle: 0,
    targetAngle: 0,
    speed: 2.2,
    color,
    name,
    isPlayer,
    boosting: false,
    boostFuel: 100,
    score: len,
    alive: true,
    target: null,
    botTimer: 0
  };
}

function reset() {
  player = makeSnake(WORLD / 2, WORLD / 2, '#ffec27', 'You', true);
  bots = [];
  for (let i = 0; i < 14; i++) {
    const x = Math.random() * WORLD;
    const y = Math.random() * WORLD;
    bots.push(makeSnake(x, y, COLORS[i % COLORS.length], NAMES[i % NAMES.length]));
  }
  food = [];
  for (let i = 0; i < 400; i++) {
    food.push({
      x: Math.random() * WORLD,
      y: Math.random() * WORLD,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      r: 4 + Math.random() * 3
    });
  }
  particles = [];
  frame = 0;
  kills = 0;
  state = 'playing';
  overlay.style.display = 'none';
}

startBtn.addEventListener('click', reset);

function dist2(ax, ay, bx, by) {
  const dx = ax - bx, dy = ay - by;
  return dx * dx + dy * dy;
}

function updateSnake(s) {
  if (!s.alive) return;

  // Decide target angle
  if (s.isPlayer) {
    // Aim toward mouse, in world coords (mouse is in screen coords)
    const cam = getCam();
    const worldMx = mouseX + cam.x;
    const worldMy = mouseY + cam.y;
    s.targetAngle = Math.atan2(worldMy - s.y, worldMx - s.x);
    s.boosting = boosting && s.boostFuel > 0 && s.score > 11;
  } else {
    botAI(s);
  }

  // Smooth turning
  let da = s.targetAngle - s.angle;
  while (da > Math.PI) da -= Math.PI * 2;
  while (da < -Math.PI) da += Math.PI * 2;
  s.angle += Math.max(-0.1, Math.min(0.1, da));

  // Movement
  let spd = s.speed;
  if (s.boosting) {
    spd *= 1.8;
    s.boostFuel -= 0.8;
    if (s.boostFuel <= 0) { s.boostFuel = 0; s.boosting = false; }
    // Lose length while boosting
    if (frame % 8 === 0 && s.score > 11) {
      s.score--;
      // Drop food behind tail
      const tail = s.seg[s.seg.length - 1];
      food.push({ x: tail.x, y: tail.y, color: s.color, r: 5 });
    }
  } else {
    s.boostFuel = Math.min(100, s.boostFuel + 0.3);
  }

  s.x += Math.cos(s.angle) * spd;
  s.y += Math.sin(s.angle) * spd;

  // World bounds — kill if hit edge
  if (s.x < 0 || s.x > WORLD || s.y < 0 || s.y > WORLD) {
    killSnake(s);
    return;
  }

  // Update body
  s.seg.unshift({ x: s.x, y: s.y });
  while (s.seg.length > s.score) s.seg.pop();

  // Eat food
  for (let i = food.length - 1; i >= 0; i--) {
    if (dist2(s.x, s.y, food[i].x, food[i].y) < 18 * 18) {
      s.score += 1;
      food.splice(i, 1);
    }
  }

  // Check head collision with other snakes' bodies
  for (const other of [player, ...bots]) {
    if (!other.alive || other === s) continue;
    for (let i = 1; i < other.seg.length; i += 2) {
      if (dist2(s.x, s.y, other.seg[i].x, other.seg[i].y) < 14 * 14) {
        killSnake(s);
        if (other.isPlayer && !s.isPlayer) kills++;
        return;
      }
    }
  }
}

function botAI(s) {
  s.botTimer--;
  if (s.botTimer > 0) return;
  s.botTimer = 8 + Math.floor(Math.random() * 8);

  // 1. Avoid edges
  const edgeMargin = 120;
  let avoidX = 0, avoidY = 0;
  if (s.x < edgeMargin) avoidX = 1;
  else if (s.x > WORLD - edgeMargin) avoidX = -1;
  if (s.y < edgeMargin) avoidY = 1;
  else if (s.y > WORLD - edgeMargin) avoidY = -1;

  // 2. Avoid snake bodies in front
  const lookAhead = 80;
  const lookX = s.x + Math.cos(s.angle) * lookAhead;
  const lookY = s.y + Math.sin(s.angle) * lookAhead;
  let danger = null;
  for (const other of [player, ...bots]) {
    if (!other.alive || other === s) continue;
    for (let i = 1; i < other.seg.length; i += 4) {
      if (dist2(lookX, lookY, other.seg[i].x, other.seg[i].y) < 60 * 60) {
        danger = other.seg[i];
        break;
      }
    }
    if (danger) break;
  }

  if (avoidX || avoidY) {
    s.targetAngle = Math.atan2(avoidY || (Math.random() - 0.5), avoidX || (Math.random() - 0.5));
  } else if (danger) {
    s.targetAngle = Math.atan2(s.y - danger.y, s.x - danger.x);
  } else {
    // Find nearest food and head for it (or random direction)
    let nearest = null, nd = Infinity;
    for (let i = 0; i < food.length; i += 3) {
      const d = dist2(s.x, s.y, food[i].x, food[i].y);
      if (d < nd && d < 250 * 250) { nd = d; nearest = food[i]; }
    }
    if (nearest) {
      s.targetAngle = Math.atan2(nearest.y - s.y, nearest.x - s.x);
    } else if (Math.random() < 0.3) {
      s.targetAngle += (Math.random() - 0.5) * 0.8;
    }
  }

  // Occasionally try to attack player by cutting them off
  if (player.alive && !s.isPlayer && Math.random() < 0.15) {
    const dp = dist2(s.x, s.y, player.x, player.y);
    if (dp < 200 * 200 && s.score > player.score * 0.7) {
      // Aim ahead of player
      const aheadX = player.x + Math.cos(player.angle) * 40;
      const aheadY = player.y + Math.sin(player.angle) * 40;
      s.targetAngle = Math.atan2(aheadY - s.y, aheadX - s.x);
    }
  }

  // Boost sometimes
  s.boosting = (Math.random() < 0.05) && s.boostFuel > 30 && s.score > 15;
}

function killSnake(s) {
  s.alive = false;
  // Drop food along body
  for (let i = 0; i < s.seg.length; i += 2) {
    food.push({
      x: s.seg[i].x + (Math.random() - 0.5) * 10,
      y: s.seg[i].y + (Math.random() - 0.5) * 10,
      color: s.color,
      r: 5 + Math.random() * 2
    });
  }
  // Particles
  for (let i = 0; i < 30; i++) {
    particles.push({
      x: s.x, y: s.y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      color: s.color,
      life: 40
    });
  }

  if (s.isPlayer) {
    state = 'dead';
    overlay.style.display = 'flex';
    document.querySelector('#overlay h2').textContent = 'YOU DIED';
    document.querySelector('#overlay p').textContent = `Length: ${s.score} — Kills: ${kills}`;
    startBtn.textContent = 'RESPAWN';
  } else {
    // Respawn bot after delay
    setTimeout(() => {
      const x = Math.random() * WORLD;
      const y = Math.random() * WORLD;
      const idx = bots.indexOf(s);
      if (idx >= 0) bots[idx] = makeSnake(x, y, s.color, s.name);
    }, 2000);
  }
}

function getCam() {
  return {
    x: Math.max(0, Math.min(WORLD - W, player.x - W / 2)),
    y: Math.max(0, Math.min(WORLD - H, player.y - H / 2))
  };
}

function drawGrid(cam) {
  ctx.strokeStyle = '#1a0028';
  ctx.lineWidth = 1;
  const grid = 60;
  const offX = -((cam.x) % grid);
  const offY = -((cam.y) % grid);
  for (let x = offX; x < W; x += grid) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = offY; y < H; y += grid) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // World border
  ctx.strokeStyle = '#ff004d';
  ctx.lineWidth = 4;
  ctx.shadowColor = '#ff004d';
  ctx.shadowBlur = 15;
  ctx.strokeRect(-cam.x, -cam.y, WORLD, WORLD);
  ctx.shadowBlur = 0;
}

function drawSnake(s, cam) {
  if (!s.alive) return;
  // Body
  ctx.strokeStyle = s.color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = s.color;
  ctx.shadowBlur = s.boosting ? 18 : 8;
  ctx.lineWidth = 14;
  ctx.beginPath();
  for (let i = 0; i < s.seg.length; i++) {
    const x = s.seg[i].x - cam.x;
    const y = s.seg[i].y - cam.y;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Pattern (stripes)
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 14;
  for (let i = 0; i < s.seg.length - 1; i += 4) {
    ctx.beginPath();
    ctx.moveTo(s.seg[i].x - cam.x, s.seg[i].y - cam.y);
    ctx.lineTo(s.seg[Math.min(i + 1, s.seg.length - 1)].x - cam.x, s.seg[Math.min(i + 1, s.seg.length - 1)].y - cam.y);
    ctx.stroke();
  }

  // Head
  const hx = s.x - cam.x;
  const hy = s.y - cam.y;
  ctx.fillStyle = s.color;
  ctx.beginPath();
  ctx.arc(hx, hy, 9, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  const ex1 = hx + Math.cos(s.angle - 0.5) * 6;
  const ey1 = hy + Math.sin(s.angle - 0.5) * 6;
  const ex2 = hx + Math.cos(s.angle + 0.5) * 6;
  const ey2 = hy + Math.sin(s.angle + 0.5) * 6;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(ex1, ey1, 3, 0, Math.PI * 2);
  ctx.arc(ex2, ey2, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(ex1 + Math.cos(s.angle) * 1, ey1 + Math.sin(s.angle) * 1, 1.5, 0, Math.PI * 2);
  ctx.arc(ex2 + Math.cos(s.angle) * 1, ey2 + Math.sin(s.angle) * 1, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Name tag
  if (!s.isPlayer) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '12px VT323, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(s.name + ' (' + s.score + ')', hx, hy - 16);
  }
}

function drawFood(cam) {
  for (const f of food) {
    const x = f.x - cam.x;
    const y = f.y - cam.y;
    if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
    ctx.fillStyle = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(x, y, f.r + Math.sin(frame * 0.1 + f.x) * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function drawParticles(cam) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life--;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 40;
    ctx.beginPath();
    ctx.arc(p.x - cam.x, p.y - cam.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function updateLeaderboard() {
  const all = [player, ...bots].filter(s => s.alive).sort((a, b) => b.score - a.score);
  let html = '';
  let rank = 0;
  let playerRank = '-';
  for (let i = 0; i < Math.min(8, all.length); i++) {
    const s = all[i];
    const isPlayer = s.isPlayer;
    if (isPlayer) playerRank = (i + 1);
    html += `<div class="row${isPlayer ? ' you' : ''}">${i + 1}. ${s.name} — ${s.score}</div>`;
  }
  // Find player rank even if not in top 8
  if (player.alive && playerRank === '-') {
    const idx = all.indexOf(player);
    if (idx >= 0) playerRank = (idx + 1);
  }
  lbEl.innerHTML = html;
  rankEl.textContent = '#' + playerRank;
  lenEl.textContent = player.score;
  killsEl.textContent = kills;
}

function tick() {
  if (state === 'playing') {
    updateSnake(player);
    for (const b of bots) updateSnake(b);
  }

  const cam = getCam();
  ctx.clearRect(0, 0, W, H);
  drawGrid(cam);
  drawFood(cam);
  for (const b of bots) drawSnake(b, cam);
  drawSnake(player, cam);
  drawParticles(cam);

  updateLeaderboard();
  frame++;
  requestAnimationFrame(tick);
}

// Init dummy state so canvas isn't empty before start
reset();
state = 'menu';
overlay.style.display = 'flex';
tick();
</script>

</body>
</html>
