<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Markus er clapped — Pac-Man</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: radial-gradient(ellipse at top, #1a0033 0%, #000 70%), #000;
    min-height: 100vh;
    font-family: 'VT323', monospace;
    color: #fff;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px;
    min-height: 100vh;
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(18px, 5vw, 38px);
    margin-bottom: 14px;
    text-align: center;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ff004d 0%, #ff8500 20%, #ffec27 40%, #00e436 60%, #29adff 80%, #ff77a8 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbow 4s linear infinite;
  }
  @keyframes rainbow { to { background-position: 200% center; } }

  .subtitle {
    font-size: 20px;
    color: #ffec27;
    margin-bottom: 12px;
    letter-spacing: 4px;
    opacity: 0.85;
  }

  .hud {
    display: flex;
    gap: 26px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    margin-bottom: 10px;
    color: #ffec27;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .hud span { color: #fff; }
  .lives-display { display: inline-flex; gap: 4px; vertical-align: middle; }
  .life-icon {
    width: 14px; height: 14px; border-radius: 50%;
    background: #ffec27;
    clip-path: polygon(100% 25%, 50% 50%, 100% 75%, 100% 100%, 0 100%, 0 0, 100% 0);
  }

  .game-wrap { position: relative; display: inline-block; }

  canvas {
    background: #000;
    border: 4px solid #29adff;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(41,173,255,.6), 0 0 80px rgba(255,0,128,.3);
    image-rendering: pixelated;
    display: block;
    max-width: 100%;
    height: auto;
    outline: none;
  }

  #message {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    color: #ffec27;
    text-shadow: 0 0 20px #ff004d, 0 0 4px #000;
    display: none;
    text-align: center;
    z-index: 10;
    background: rgba(0,0,0,0.85);
    padding: 20px 30px;
    border: 2px solid #ffec27;
    border-radius: 8px;
  }
  #message small {
    display: block;
    font-size: 11px;
    margin-top: 12px;
    color: #fff;
  }

  .controls {
    margin-top: 12px;
    font-size: 18px;
    color: #aaa;
    text-align: center;
  }
  .controls kbd {
    background: #222;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 1px 7px;
    color: #ffec27;
    font-family: 'VT323', monospace;
  }
</style>
</head>
<body>

<a href="index.html" style="position:fixed;top:20px;left:20px;font-family:'Press Start 2P',monospace;font-size:11px;color:#000;background:#ffec27;padding:8px 14px;border-radius:4px;text-decoration:none;z-index:100;">← ARCADE</a>

<h1>Markus er clapped</h1>
<div class="subtitle">★ PAC-MAN ★</div>

<div class="hud">
  SCORE: <span id="score">0</span>
  HIGH: <span id="high">0</span>
  LEVEL: <span id="level">1</span>
  LIVES: <span id="lives" class="lives-display"></span>
</div>

<div class="game-wrap">
  <canvas id="game" tabindex="0"></canvas>
  <div id="message"></div>
</div>

<div class="controls">
  <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> — <kbd>R</kbd> restart — <kbd>P</kbd> pause
</div>

<script>
'use strict';

// ==================== MAZE ====================
// # = wall, . = dot, o = power pellet, space = empty, - = door (added by code)
const MAZE = [
  "############################",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#o####.#####.##.#####.####o#",
  "#.####.#####.##.#####.####.#",
  "#..........................#",
  "#.####.##.########.##.####.#",
  "#.####.##.########.##.####.#",
  "#......##....##....##......#",
  "######.##### ## #####.######",
  "######.##### ## #####.######",
  "######.##          ##.######",
  "######.## ######## ##.######",
  "######.## #      # ##.######",
  "      .   #      #   .      ",
  "######.## #      # ##.######",
  "######.## ######## ##.######",
  "######.##          ##.######",
  "######.## ######## ##.######",
  "######.## ######## ##.######",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#.####.#####.##.#####.####.#",
  "#o..##.......  .......##..o#",
  "###.##.##.########.##.##.###",
  "###.##.##.########.##.##.###",
  "#......##....##....##......#",
  "#.##########.##.##########.#",
  "#.##########.##.##########.#",
  "#..........................#",
  "############################"
];

const COLS = 28;
const ROWS = MAZE.length;
const TILE = 18;

// Tile types
const EMPTY = 0, WALL = 1, DOT = 2, PELLET = 3, DOOR = 4;

function buildGrid() {
  const g = MAZE.map(row => row.split('').map(ch => {
    if (ch === '#') return WALL;
    if (ch === '.') return DOT;
    if (ch === 'o') return PELLET;
    return EMPTY;
  }));
  // Ghost house door — open the top center of the house at row 12
  g[12][13] = DOOR;
  g[12][14] = DOOR;
  return g;
}

let grid = buildGrid();

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = COLS * TILE;
canvas.height = ROWS * TILE;
canvas.focus();

const scoreEl = document.getElementById('score');
const highEl = document.getElementById('high');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const messageEl = document.getElementById('message');

// ==================== GAME STATE ====================
let score = 0;
let highScore = +(localStorage.getItem('pacHigh') || 0);
let lives = 3;
let level = 1;
let dotsEaten = 0;
let totalDots = 0;
let state = 'ready';
let readyTimer = 90;
let dyingTimer = 0;
let frightTimer = 0;
let frightCombo = 0;
let ghostMode = 'scatter';
let modeTimer = 0;
let frame = 0;

const FRUITS = [
  { name: 'cherry',     points: 100,  color: '#ff004d' },
  { name: 'strawberry', points: 300,  color: '#ff77a8' },
  { name: 'orange',     points: 500,  color: '#ff8500' },
  { name: 'apple',      points: 700,  color: '#c81010' },
  { name: 'melon',      points: 1000, color: '#00e436' },
  { name: 'galaxian',   points: 2000, color: '#29adff' },
  { name: 'bell',       points: 3000, color: '#ffec27' },
  { name: 'key',        points: 5000, color: '#ffffff' }
];
let fruit = null;
let fruitTimer = 0;
const popups = [];

function countDots() {
  let n = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c] === DOT || grid[r][c] === PELLET) n++;
  return n;
}

// Wrap column for tunnel
function wrapCol(c) {
  return ((c % COLS) + COLS) % COLS;
}

function tileAt(c, r) {
  if (r < 0 || r >= ROWS) return WALL;
  return grid[r][wrapCol(c)];
}

function isBlocked(c, r, allowDoor = false) {
  const t = tileAt(c, r);
  if (t === DOOR) return !allowDoor;
  return t === WALL;
}

// ==================== ENTITIES ====================
// CRITICAL: positions are floats, but movement is tile-grid-aligned.
// "tile" of an entity = the tile its center is on = floor(x + 0.5) etc.
// We snap to integers at decision points.

function makeEntity(c, r) {
  return {
    x: c, y: r,
    startX: c, startY: r,
    dx: 0, dy: 0,        // current direction
    nx: 0, ny: 0,        // queued direction
    speed: 0.1
  };
}

// Pac-Man starts at column 14, row 23 (integer tile)
const pac = makeEntity(14, 23);
pac.speed = 0.11;
pac.mouth = 0.2;
pac.mouthOpen = true;

function makeGhost(name, color, c, r, scatterC, scatterR, dotLimit) {
  const g = makeEntity(c, r);
  g.name = name;
  g.color = color;
  g.scatterC = scatterC;
  g.scatterR = scatterR;
  g.frightened = false;
  g.eaten = false;
  g.inHouse = name !== 'blinky';
  g.exiting = false;
  g.dotLimit = dotLimit;
  g.dx = -1; g.dy = 0;
  g.speed = 0.085;
  return g;
}

// Blinky starts above the house, others inside
const ghosts = [
  makeGhost('blinky', '#ff004d', 14, 11, 25, -2, 0),
  makeGhost('pinky',  '#ff77a8', 14, 14, 2, -2, 0),
  makeGhost('inky',   '#29adff', 12, 14, 27, 32, 10),
  makeGhost('clyde',  '#ff8500', 16, 14, 0, 32, 25)
];

// ==================== INPUT ====================
function setDir(dx, dy) {
  pac.nx = dx;
  pac.ny = dy;
}

window.addEventListener('keydown', function(e) {
  const k = e.key;
  let handled = false;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { setDir(0, -1); handled = true; }
  else if (k === 'ArrowDown' || k === 's' || k === 'S') { setDir(0, 1); handled = true; }
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') { setDir(-1, 0); handled = true; }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { setDir(1, 0); handled = true; }
  else if (k === 'r' || k === 'R') { restart(); handled = true; }
  else if (k === 'p' || k === 'P') {
    if (state === 'playing') { state = 'paused'; showMessage('PAUSED', 'Press P to resume'); }
    else if (state === 'paused') { state = 'playing'; hideMessage(); }
    handled = true;
  } else if (k === ' ' || k === 'Enter') {
    if (state === 'gameover') restart();
    else if (state === 'won') nextLevel();
    handled = true;
  }
  if (handled) e.preventDefault();
});

// Touch
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }
  touchStart = null;
  e.preventDefault();
}, { passive: false });

// ==================== MOVEMENT ====================
// Returns true when an entity's center is within `threshold` of an integer tile.
function atCenter(e, threshold = 0.15) {
  const fx = e.x - Math.round(e.x);
  const fy = e.y - Math.round(e.y);
  return Math.abs(fx) < threshold && Math.abs(fy) < threshold;
}

function tileC(e) { return Math.round(e.x); }
function tileR(e) { return Math.round(e.y); }

// Can the entity, currently at integer tile (tc, tr), move in direction (dx, dy)?
function canEnter(tc, tr, dx, dy, allowDoor = false) {
  return !isBlocked(tc + dx, tr + dy, allowDoor);
}

function updatePacMovement() {
  // 180° turn at any time
  if (pac.nx !== 0 || pac.ny !== 0) {
    if (pac.nx === -pac.dx && pac.ny === -pac.dy && (pac.dx !== 0 || pac.dy !== 0)) {
      pac.dx = pac.nx;
      pac.dy = pac.ny;
      pac.nx = 0; pac.ny = 0;
    }
  }

  // At tile center: try to apply queued direction, OR start moving if currently stopped
  if (atCenter(pac)) {
    const tc = tileC(pac);
    const tr = tileR(pac);

    // Try queued direction
    if ((pac.nx !== 0 || pac.ny !== 0) && canEnter(tc, tr, pac.nx, pac.ny)) {
      pac.x = tc; pac.y = tr;
      pac.dx = pac.nx; pac.dy = pac.ny;
      pac.nx = 0; pac.ny = 0;
    }
    // If can't continue current direction, stop
    else if ((pac.dx !== 0 || pac.dy !== 0) && !canEnter(tc, tr, pac.dx, pac.dy)) {
      pac.x = tc; pac.y = tr;
      pac.dx = 0; pac.dy = 0;
    }
  }

  // Move
  pac.x += pac.dx * pac.speed;
  pac.y += pac.dy * pac.speed;

  // Tunnel wrap
  if (pac.x < -0.5) pac.x = COLS - 0.5;
  else if (pac.x > COLS - 0.5) pac.x = -0.5;
}

function eatAtPacTile() {
  const c = tileC(pac);
  const r = tileR(pac);
  if (r < 0 || r >= ROWS) return;
  const cc = wrapCol(c);
  const t = grid[r][cc];
  if (t === DOT) {
    grid[r][cc] = EMPTY;
    score += 10;
    dotsEaten++;
    checkFruitSpawn();
  } else if (t === PELLET) {
    grid[r][cc] = EMPTY;
    score += 50;
    dotsEaten++;
    // Frightened duration drops sharply by level — by level 8+ pellets barely scare ghosts
    frightTimer = Math.max(30, 420 - level * 50);
    frightCombo = 0;
    ghosts.forEach(g => {
      if (!g.eaten && !g.inHouse) {
        g.frightened = true;
        // Reverse
        g.dx = -g.dx; g.dy = -g.dy;
      }
    });
    checkFruitSpawn();
  }

  // Eat fruit
  if (fruit && Math.hypot(pac.x - fruit.x, pac.y - fruit.y) < 0.7) {
    score += fruit.points;
    popups.push({ x: fruit.x, y: fruit.y, text: fruit.points, color: '#ff77a8', life: 60 });
    fruit = null;
    fruitTimer = 0;
  }

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('pacHigh', highScore);
  }

  if (dotsEaten >= totalDots) {
    state = 'won';
    showMessage('LEVEL CLEAR!', 'Press SPACE for next level');
  }
}

function checkFruitSpawn() {
  if ((dotsEaten === 70 || dotsEaten === 170) && !fruit) {
    const f = FRUITS[Math.min(level - 1, FRUITS.length - 1)];
    fruit = { x: 14, y: 17, ...f };
    fruitTimer = 540;
  }
}

function updatePacMouth() {
  if (pac.dx || pac.dy) {
    if (pac.mouthOpen) {
      pac.mouth += 0.08;
      if (pac.mouth >= 0.55) pac.mouthOpen = false;
    } else {
      pac.mouth -= 0.08;
      if (pac.mouth <= 0.05) pac.mouthOpen = true;
    }
  }
}

// ==================== GHOST AI ====================
function ghostTargetTile(g) {
  if (g.eaten) return { c: 14, r: 11 };
  if (g.frightened) return null;
  if (ghostMode === 'scatter') return { c: g.scatterC, r: g.scatterR };

  // Chase
  if (g.name === 'blinky') return { c: pac.x, r: pac.y };
  if (g.name === 'pinky')  return { c: pac.x + pac.dx * 4, r: pac.y + pac.dy * 4 };
  if (g.name === 'inky') {
    const b = ghosts[0];
    const px = pac.x + pac.dx * 2;
    const py = pac.y + pac.dy * 2;
    return { c: 2 * px - b.x, r: 2 * py - b.y };
  }
  if (g.name === 'clyde') {
    const d = Math.hypot(g.x - pac.x, g.y - pac.y);
    return d > 8 ? { c: pac.x, r: pac.y } : { c: g.scatterC, r: g.scatterR };
  }
  return { c: pac.x, r: pac.y };
}

function updateGhost(g) {
  // In house: wait for release
  if (g.inHouse && !g.exiting) {
    if (dotsEaten >= g.dotLimit) {
      g.exiting = true;
    } else {
      g.y += Math.sin(frame * 0.15) * 0.02;
      return;
    }
  }

  // Exiting house: move to door above
  if (g.exiting) {
    const targetX = 14;
    const targetY = 11;
    if (Math.abs(g.x - targetX) > 0.1) {
      g.x += (targetX > g.x ? 1 : -1) * 0.05;
      if (Math.abs(g.x - targetX) < 0.1) g.x = targetX;
    } else if (g.y > targetY) {
      g.x = targetX;
      g.y -= 0.06;
      if (g.y < targetY) g.y = targetY;
    } else {
      g.inHouse = false;
      g.exiting = false;
      g.dx = -1; g.dy = 0;
    }
    return;
  }

  // Eaten ghost returning to house
  if (g.eaten) {
    g.speed = 0.18;
    if (Math.abs(g.x - 14) < 0.4 && Math.abs(g.y - 11) < 0.4) {
      // Arrived at house entrance — drop in
      g.eaten = false;
      g.frightened = false;
      g.inHouse = true;
      g.exiting = true;
      g.x = 14; g.y = 14;
      return;
    }
  } else if (g.frightened) {
    // Frightened ghosts also get faster each level (harder to catch)
    g.speed = 0.05 + Math.min(level - 1, 8) * 0.003;
  } else {
    // Normal ghost speed scales sharply with level
    g.speed = 0.085 + Math.min(level - 1, 12) * 0.012;
  }

  // Decision at tile center — but only re-decide when crossing INTO a new tile center
  // Track last tile we made a decision at to avoid getting stuck in snap loops
  const tc = tileC(g);
  const tr = tileR(g);
  const justCrossedCenter = atCenter(g) && (g.lastDecisionTile !== tc * 1000 + tr);

  if (justCrossedCenter) {
    g.lastDecisionTile = tc * 1000 + tr;

    // Try all 4 directions, exclude reverse
    const options = [
      [0, -1], [-1, 0], [0, 1], [1, 0]   // up, left, down, right (tie-break order)
    ];
    const valid = options.filter(([dx, dy]) => {
      if (dx === -g.dx && dy === -g.dy) return false;
      return !isBlocked(tc + dx, tr + dy, g.eaten);
    });

    let choices = valid.length ? valid : options.filter(([dx, dy]) => !isBlocked(tc + dx, tr + dy, true));

    if (choices.length) {
      const target = ghostTargetTile(g);
      let pick;
      if (g.frightened && !g.eaten) {
        pick = choices[Math.floor(Math.random() * choices.length)];
      } else if (target) {
        let bestD = Infinity;
        pick = choices[0];
        for (const [dx, dy] of choices) {
          const nc = tc + dx;
          const nr = tr + dy;
          const dist = (nc - target.c) ** 2 + (nr - target.r) ** 2;
          if (dist < bestD) { bestD = dist; pick = [dx, dy]; }
        }
      } else {
        pick = choices[0];
      }
      // Only snap to exact tile center when actually changing direction
      if (pick[0] !== g.dx || pick[1] !== g.dy) {
        g.x = tc; g.y = tr;
      }
      g.dx = pick[0]; g.dy = pick[1];
    }
  }

  // Move
  g.x += g.dx * g.speed;
  g.y += g.dy * g.speed;

  // Tunnel
  if (g.x < -0.5) g.x = COLS - 0.5;
  else if (g.x > COLS - 0.5) g.x = -0.5;

  // Collision with Pac-Man
  if (!g.eaten && state === 'playing') {
    if (Math.hypot(g.x - pac.x, g.y - pac.y) < 0.7) {
      if (g.frightened) {
        g.eaten = true;
        g.frightened = false;
        frightCombo++;
        const pts = 200 * Math.pow(2, frightCombo - 1);
        score += pts;
        popups.push({ x: g.x, y: g.y, text: pts, color: '#29adff', life: 60 });
      } else {
        die();
      }
    }
  }
}

// ==================== STATE ====================
function die() {
  if (state !== 'playing') return;
  state = 'dying';
  dyingTimer = 90;
  lives--;
}

function resetPositions() {
  pac.x = pac.startX; pac.y = pac.startY;
  pac.dx = 0; pac.dy = 0;
  pac.nx = 0; pac.ny = 0;
  ghosts.forEach(g => {
    g.x = g.startX; g.y = g.startY;
    g.dx = -1; g.dy = 0;
    g.frightened = false;
    g.eaten = false;
    g.inHouse = g.name !== 'blinky';
    g.exiting = false;
  });
  frightTimer = 0;
  modeTimer = 0;
  ghostMode = 'chase';
  state = 'ready';
  readyTimer = 90;
}

function restart() {
  grid = buildGrid();
  totalDots = countDots();
  dotsEaten = 0;
  score = 0;
  lives = 3;
  level = 1;
  fruit = null;
  fruitTimer = 0;
  popups.length = 0;
  resetPositions();
  hideMessage();
}

function nextLevel() {
  level++;
  grid = buildGrid();
  totalDots = countDots();
  dotsEaten = 0;
  fruit = null;
  fruitTimer = 0;
  // Each level, ghosts leave the house faster
  ghosts[2].dotLimit = Math.max(0, 10 - level * 2);
  ghosts[3].dotLimit = Math.max(0, 25 - level * 4);
  resetPositions();
  hideMessage();
}

function showMessage(text, sub = '') {
  messageEl.innerHTML = text + (sub ? '<small>' + sub + '</small>' : '');
  messageEl.style.display = 'block';
}
function hideMessage() {
  messageEl.style.display = 'none';
}

function updateHUD() {
  scoreEl.textContent = score;
  highEl.textContent = highScore;
  levelEl.textContent = level;
  livesEl.innerHTML = '';
  for (let i = 0; i < Math.max(0, lives - 1); i++) {
    const d = document.createElement('span');
    d.className = 'life-icon';
    livesEl.appendChild(d);
  }
}

// ==================== DRAWING ====================
function drawMaze() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      const x = c * TILE;
      const y = r * TILE;
      if (t === WALL) {
        ctx.fillStyle = '#0a1a55';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.strokeStyle = '#29adff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x + 1.5, y + 1.5, TILE - 3, TILE - 3);
      } else if (t === DOOR) {
        ctx.fillStyle = '#ff77a8';
        ctx.fillRect(x, y + TILE / 2 - 1, TILE, 3);
      } else if (t === DOT) {
        ctx.fillStyle = '#ffec27';
        ctx.beginPath();
        ctx.arc(x + TILE / 2, y + TILE / 2, 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (t === PELLET) {
        const pulse = 4.5 + Math.sin(frame * 0.2) * 1.5;
        ctx.fillStyle = '#ffec27';
        ctx.shadowColor = '#ffec27';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(x + TILE / 2, y + TILE / 2, pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  }
}

// Entity center in pixels — tile (c,r) at integer = center of that tile
function px(e) { return e.x * TILE + TILE / 2; }
function py(e) { return e.y * TILE + TILE / 2; }

function drawFruit() {
  if (!fruit) return;
  const cx = fruit.x * TILE + TILE / 2;
  const cy = fruit.y * TILE + TILE / 2;
  ctx.fillStyle = fruit.color;
  ctx.shadowColor = fruit.color;
  ctx.shadowBlur = 12;

  if (fruit.name === 'cherry') {
    ctx.beginPath();
    ctx.arc(cx - 4, cy + 3, 4, 0, Math.PI * 2);
    ctx.arc(cx + 4, cy + 3, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#00e436';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 4, cy + 1);
    ctx.quadraticCurveTo(cx, cy - 6, cx + 4, cy + 1);
    ctx.stroke();
  } else if (fruit.name === 'strawberry') {
    ctx.beginPath();
    ctx.moveTo(cx, cy - 5);
    ctx.lineTo(cx + 6, cy + 2);
    ctx.lineTo(cx, cy + 7);
    ctx.lineTo(cx - 6, cy + 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#00e436';
    ctx.fillRect(cx - 3, cy - 7, 6, 3);
  } else if (fruit.name === 'orange' || fruit.name === 'apple') {
    ctx.beginPath();
    ctx.arc(cx, cy + 1, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#00e436';
    ctx.fillRect(cx - 1, cy - 7, 2, 4);
  } else if (fruit.name === 'melon') {
    ctx.beginPath();
    ctx.ellipse(cx, cy, 6, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (fruit.name === 'galaxian') {
    ctx.beginPath();
    ctx.moveTo(cx, cy - 5);
    ctx.lineTo(cx + 6, cy + 5);
    ctx.lineTo(cx - 6, cy + 5);
    ctx.closePath();
    ctx.fill();
  } else if (fruit.name === 'bell') {
    ctx.beginPath();
    ctx.arc(cx, cy, 6, Math.PI, 0);
    ctx.lineTo(cx + 5, cy + 5);
    ctx.lineTo(cx - 5, cy + 5);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(cx - 3, cy, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(cx - 1, cy - 1, 7, 2);
  }
  ctx.shadowBlur = 0;
}

function drawPac() {
  const cx = px(pac);
  const cy = py(pac);
  const r = TILE * 0.55;

  if (state === 'dying') {
    const p = 1 - dyingTimer / 90;
    if (p < 1) {
      ctx.fillStyle = '#ffec27';
      ctx.shadowColor = '#ffec27';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      const open = p * Math.PI;
      ctx.arc(cx, cy, r, -Math.PI / 2 + open, -Math.PI / 2 - open + Math.PI * 2);
      ctx.lineTo(cx, cy);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    return;
  }

  let angle = 0;
  if (pac.dx === 1) angle = 0;
  else if (pac.dx === -1) angle = Math.PI;
  else if (pac.dy === -1) angle = -Math.PI / 2;
  else if (pac.dy === 1) angle = Math.PI / 2;

  const mouth = (pac.dx || pac.dy) ? pac.mouth : 0.2;

  ctx.fillStyle = '#ffec27';
  ctx.shadowColor = '#ffec27';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(cx, cy, r, angle + mouth * Math.PI, angle - mouth * Math.PI + Math.PI * 2);
  ctx.lineTo(cx, cy);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawGhost(g) {
  const cx = px(g);
  const cy = py(g);
  const r = TILE * 0.55;

  if (g.eaten) {
    drawEyes(cx, cy, g.dx, g.dy);
    return;
  }

  let color = g.color;
  if (g.frightened) {
    const flash = frightTimer < 120 && Math.floor(frame / 10) % 2 === 0;
    color = flash ? '#ffffff' : '#1a3aff';
  }

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI, 0);
  // Bottom skirt
  const wave = Math.floor(frame / 8) % 2;
  ctx.lineTo(cx + r, cy + r * 0.85);
  const segs = 4;
  for (let i = 0; i < segs; i++) {
    const x1 = cx + r - ((i + 0.5) * (r * 2 / segs));
    const dip = (i + wave) % 2 === 0 ? cy + r * 0.5 : cy + r * 0.85;
    ctx.lineTo(x1, dip);
  }
  ctx.lineTo(cx - r, cy + r * 0.85);
  ctx.closePath();
  ctx.fill();

  if (g.frightened) {
    ctx.fillStyle = color === '#ffffff' ? '#ff004d' : '#ffec27';
    ctx.beginPath();
    ctx.arc(cx - 3, cy - 1, 1.6, 0, Math.PI * 2);
    ctx.arc(cx + 3, cy - 1, 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = color === '#ffffff' ? '#ff004d' : '#ffec27';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy + 3);
    ctx.lineTo(cx - 2.5, cy + 1);
    ctx.lineTo(cx, cy + 3);
    ctx.lineTo(cx + 2.5, cy + 1);
    ctx.lineTo(cx + 5, cy + 3);
    ctx.stroke();
  } else {
    drawEyes(cx, cy, g.dx, g.dy);
  }
}

function drawEyes(cx, cy, dx, dy) {
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx - 3, cy - 1, 2.6, 0, Math.PI * 2);
  ctx.arc(cx + 3, cy - 1, 2.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  const ox = dx * 1.3;
  const oy = dy * 1.3;
  ctx.beginPath();
  ctx.arc(cx - 3 + ox, cy - 1 + oy, 1.3, 0, Math.PI * 2);
  ctx.arc(cx + 3 + ox, cy - 1 + oy, 1.3, 0, Math.PI * 2);
  ctx.fill();
}

function drawPopups() {
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    ctx.fillStyle = p.color;
    ctx.font = 'bold 11px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.globalAlpha = p.life / 60;
    ctx.fillText(String(p.text), p.x * TILE + TILE / 2, p.y * TILE + TILE / 2 - (60 - p.life) * 0.5);
    ctx.globalAlpha = 1;
    p.life--;
    if (p.life <= 0) popups.splice(i, 1);
  }
}

function drawReady() {
  ctx.fillStyle = '#ffec27';
  ctx.font = 'bold 14px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('READY!', canvas.width / 2, 20 * TILE - 4);
}

// ==================== MAIN LOOP ====================
function tick() {
  frame++;

  if (state === 'playing') {
    // Mode timer — scatter shrinks each level, chase grows
    modeTimer++;
    const scatterDuration = Math.max(0, 180 - level * 30);
    const chaseDuration = 1800 + level * 120;
    if (ghostMode === 'scatter' && modeTimer > scatterDuration) {
      ghostMode = 'chase'; modeTimer = 0;
      ghosts.forEach(g => {
        if (!g.inHouse && !g.eaten && !g.frightened) { g.dx = -g.dx; g.dy = -g.dy; }
      });
    } else if (ghostMode === 'chase' && modeTimer > chaseDuration) {
      ghostMode = 'scatter'; modeTimer = 0;
      ghosts.forEach(g => {
        if (!g.inHouse && !g.eaten && !g.frightened) { g.dx = -g.dx; g.dy = -g.dy; }
      });
    }

    if (frightTimer > 0) {
      frightTimer--;
      if (frightTimer === 0) {
        ghosts.forEach(g => { if (!g.eaten) g.frightened = false; });
        frightCombo = 0;
      }
    }

    if (fruit && fruitTimer > 0) {
      fruitTimer--;
      if (fruitTimer <= 0) fruit = null;
    }

    updatePacMovement();
    updatePacMouth();
    eatAtPacTile();
    ghosts.forEach(updateGhost);
  } else if (state === 'ready') {
    readyTimer--;
    if (readyTimer <= 0) state = 'playing';
  } else if (state === 'dying') {
    dyingTimer--;
    if (dyingTimer <= 0) {
      if (lives <= 0) {
        state = 'gameover';
        showMessage('GAME OVER', 'Press R or SPACE to restart');
      } else {
        resetPositions();
      }
    }
  }

  // Draw
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawMaze();
  drawFruit();
  drawPac();
  if (state !== 'dying') ghosts.forEach(drawGhost);
  drawPopups();
  if (state === 'ready') drawReady();
  updateHUD();

  requestAnimationFrame(tick);
}

// ==================== INIT ====================
totalDots = countDots();
updateHUD();
tick();
</script>
