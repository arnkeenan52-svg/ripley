<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slope — Markus er milf enjoyer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #000;
    min-height: 100vh;
    font-family: 'VT323', monospace;
    color: #fff;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    min-height: 100vh;
  }

  .back {
    position: fixed;
    top: 16px; left: 16px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #000;
    background: #00e436;
    padding: 8px 14px;
    border-radius: 4px;
    text-decoration: none;
    z-index: 100;
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 3.5vw, 26px);
    margin-bottom: 2px;
    text-align: center;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #00ff44 0%, #29adff 50%, #ff77a8 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbow 4s linear infinite;
  }
  @keyframes rainbow { to { background-position: 200% center; } }

  .subtitle {
    font-size: 16px;
    color: #00ff44;
    margin-bottom: 8px;
    letter-spacing: 3px;
  }

  .hud {
    display: flex;
    gap: 22px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    margin-bottom: 6px;
    color: #00ff44;
  }
  .hud span { color: #fff; }

  #wrap {
    position: relative;
    border: 3px solid #00ff44;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,255,68,.5);
    background: #000;
  }
  canvas { display: block; }

  #hint {
    position: absolute;
    top: 14px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: #00ff44;
    text-shadow: 0 0 6px #00ff44, 0 0 12px #00ff44;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.5s;
  }

  .controls {
    margin-top: 8px;
    font-size: 16px;
    color: #aaa;
  }
  .controls kbd {
    background: #222; border: 1px solid #444; border-radius: 4px;
    padding: 1px 7px; color: #00ff44;
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 50;
    font-family: 'Press Start 2P', monospace;
    text-align: center;
    padding: 20px;
  }
  #overlay h2 {
    color: #ff0033;
    font-size: 28px;
    margin-bottom: 16px;
    text-shadow: 0 0 20px #ff0033;
  }
  #overlay p { color: #fff; font-size: 13px; margin-bottom: 20px; }
  #overlay button {
    background: #00ff44;
    color: #000;
    border: none;
    padding: 14px 28px;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  #overlay button:hover { background: #29adff; }
</style>
</head>
<body>

<a class="back" href="index.html">← ARCADE</a>

<h1>Markus er milf enjoyer</h1>
<div class="subtitle">★ SLOPE ★</div>

<div class="hud">
  SCORE: <span id="score">0</span>
  BEST: <span id="best">0</span>
  SPEED: <span id="spd">1.0x</span>
</div>

<div id="wrap">
  <div id="hint">steer with arrows, a/d or q/d</div>
</div>

<div class="controls">
  <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd>
</div>

<div id="overlay">
  <h2>SLOPE</h2>
  <p>Run down the tunnel. Avoid the red wireframes.</p>
  <button id="startBtn">START</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const wrap = document.getElementById('wrap');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const spdEl = document.getElementById('spd');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const hint = document.getElementById('hint');

// === Setup ===
function getSize() {
  const w = Math.min(900, window.innerWidth - 30);
  const h = Math.min(560, Math.max(400, window.innerHeight - 220));
  return { w, h };
}
let { w: W, h: H } = getSize();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 25, 90);

const camera = new THREE.PerspectiveCamera(75, W / H, 0.1, 200);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
wrap.appendChild(renderer.domElement);

// === Tunnel geometry ===
// We make a "tunnel" using thick line tubes:
//  - GREEN rings at regular Z intervals (cross-section octagons)
//  - GREEN longitudinal lines along the top/bottom of the tunnel
//  - RED longitudinal "walls" along the left/right sides (these are the obstacles to avoid)
// Player position = angle around the tunnel. We rotate the tunnel so the player's
// angle appears at the bottom of the camera view.

const TUNNEL_RADIUS = 6;
const TUNNEL_LENGTH = 300;
const RING_SPACING = 3;       // rings every 3 units
const RING_COUNT = Math.floor(TUNNEL_LENGTH / RING_SPACING);
const SIDES = 8;              // octagon

const tunnelGroup = new THREE.Group();
scene.add(tunnelGroup);

// Material: glowing green for tunnel mesh
const greenMat = new THREE.LineBasicMaterial({ color: 0x00ff44 });
const redMat = new THREE.LineBasicMaterial({ color: 0xff0033 });

// Build the green octagonal rings + green longitudinal lines along TOP and BOTTOM
const greenPositions = [];

// Rings — all 8 sides drawn green
for (let i = 0; i <= RING_COUNT; i++) {
  const z = -i * RING_SPACING;
  for (let s = 0; s < SIDES; s++) {
    const a1 = (s / SIDES) * Math.PI * 2 + Math.PI / SIDES; // offset so flat side is at bottom
    const a2 = ((s + 1) / SIDES) * Math.PI * 2 + Math.PI / SIDES;
    const x1 = Math.cos(a1) * TUNNEL_RADIUS;
    const y1 = Math.sin(a1) * TUNNEL_RADIUS;
    const x2 = Math.cos(a2) * TUNNEL_RADIUS;
    const y2 = Math.sin(a2) * TUNNEL_RADIUS;
    greenPositions.push(x1, y1, z, x2, y2, z);
  }
}

// Longitudinal lines — GREEN at top half, RED at bottom-left and bottom-right (the walls)
const redPositions = [];
for (let s = 0; s < SIDES; s++) {
  const a = (s / SIDES) * Math.PI * 2 + Math.PI / SIDES;
  const x = Math.cos(a) * TUNNEL_RADIUS;
  const y = Math.sin(a) * TUNNEL_RADIUS;
  // Determine whether this seam is a "wall" (red) or normal (green)
  // The bottom of the tunnel is at angle = -PI/2 (south).
  // The two seams adjacent to the bottom — and the floor itself — should NOT be red.
  // We'll mark the two side walls (angles closest to ±0 and ±PI) as red.
  // For an octagon with the offset, seams are at PI/8, 3PI/8, 5PI/8, 7PI/8, 9PI/8, 11PI/8, 13PI/8, 15PI/8
  // The "side walls" are at angles closest to 0 (right) and PI (left): 15PI/8 (≈ -PI/8) & PI/8 on the right; 7PI/8 & 9PI/8 on the left.
  // So sides s=0,1 (right) and s=4,5 (left top) should be... let's actually pick by angle:
  const aMod = ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  // Red if angle is roughly horizontal (near 0 or PI)
  const distFromHoriz = Math.min(
    Math.abs(aMod),
    Math.abs(aMod - Math.PI),
    Math.abs(aMod - Math.PI * 2)
  );
  const isRed = distFromHoriz < Math.PI / 4;

  for (let i = 0; i < RING_COUNT; i++) {
    const z1 = -i * RING_SPACING;
    const z2 = -(i + 1) * RING_SPACING;
    if (isRed) {
      redPositions.push(x, y, z1, x, y, z2);
    } else {
      greenPositions.push(x, y, z1, x, y, z2);
    }
  }
}

const greenGeom = new THREE.BufferGeometry();
greenGeom.setAttribute('position', new THREE.Float32BufferAttribute(greenPositions, 3));
tunnelGroup.add(new THREE.LineSegments(greenGeom, greenMat));

const redGeom = new THREE.BufferGeometry();
redGeom.setAttribute('position', new THREE.Float32BufferAttribute(redPositions, 3));
tunnelGroup.add(new THREE.LineSegments(redGeom, redMat));

// === Obstacles ===
// Red wireframe barriers blocking part of the tunnel circumference. Player has to be
// at a different angle to pass through.
const obstacles = [];

function makeObstacle(z) {
  // Place obstacle on the floor area (avoid the side walls) for visibility.
  // Random angle in the lower half of the tunnel.
  const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.8;
  const arcWidth = 0.7 + Math.random() * 0.6;
  const depth = 1.2;

  const positions = [];
  const segs = 6;

  // Front ring (z = z) — arc segment
  for (let i = 0; i < segs; i++) {
    const a1 = angle - arcWidth/2 + (i / segs) * arcWidth;
    const a2 = angle - arcWidth/2 + ((i + 1) / segs) * arcWidth;
    const x1 = Math.cos(a1) * TUNNEL_RADIUS;
    const y1 = Math.sin(a1) * TUNNEL_RADIUS;
    const x2 = Math.cos(a2) * TUNNEL_RADIUS;
    const y2 = Math.sin(a2) * TUNNEL_RADIUS;
    // Front edge
    positions.push(x1, y1, z, x2, y2, z);
    // Back edge
    positions.push(x1, y1, z - depth, x2, y2, z - depth);
  }
  // Vertical bars
  for (let i = 0; i <= segs; i++) {
    const a = angle - arcWidth/2 + (i / segs) * arcWidth;
    const x = Math.cos(a) * TUNNEL_RADIUS;
    const y = Math.sin(a) * TUNNEL_RADIUS;
    positions.push(x, y, z, x, y, z - depth);
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  const lines = new THREE.LineSegments(geom, redMat);
  lines.userData = { angle, arc: arcWidth };
  scene.add(lines);
  obstacles.push(lines);
}

// === Player ball ===
// Wireframe sphere at the bottom-center of the camera view.
const ballGeom = new THREE.SphereGeometry(1.0, 16, 10);
const ballEdges = new THREE.WireframeGeometry(ballGeom);
const ballWire = new THREE.LineSegments(ballEdges, new THREE.LineBasicMaterial({ color: 0x00ff44 }));
scene.add(ballWire);

// === Game state ===
let best = +(localStorage.getItem('slopeBestV3') || 0);
bestEl.textContent = best;

let state = 'menu';
let playerAngle = -Math.PI / 2;   // bottom of tunnel
let playerAngleV = 0;
let speed = 0.35;
let distance = 0;
let frame = 0;
let nextObstacleZ = 30;
let tunnelOffset = 0;             // how far the tunnel has scrolled (mod RING_SPACING)

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowleft','arrowright','a','d','q'].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Touch — drag left/right to steer
let touchStartX = null;
renderer.domElement.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  e.preventDefault();
}, {passive: false});
renderer.domElement.addEventListener('touchmove', e => {
  if (touchStartX === null) return;
  const dx = e.touches[0].clientX - touchStartX;
  playerAngleV += dx * 0.0012;
  touchStartX = e.touches[0].clientX;
  e.preventDefault();
}, {passive: false});
renderer.domElement.addEventListener('touchend', () => { touchStartX = null; });

startBtn.addEventListener('click', reset);

function reset() {
  state = 'playing';
  playerAngle = -Math.PI / 2;
  playerAngleV = 0;
  speed = 0.35;
  distance = 0;
  frame = 0;
  tunnelOffset = 0;
  nextObstacleZ = 30;
  for (const o of obstacles) scene.remove(o);
  obstacles.length = 0;
  overlay.style.display = 'none';
  hint.style.opacity = '1';
  setTimeout(() => { hint.style.opacity = '0'; }, 2500);
}

function angleDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function update() {
  frame++;

  // Steering input
  let steer = 0;
  if (keys.arrowleft || keys.a || keys.q) steer -= 1;
  if (keys.arrowright || keys.d) steer += 1;
  playerAngleV += steer * 0.009;
  playerAngleV *= 0.88;
  if (Math.abs(playerAngleV) > 0.12) playerAngleV = Math.sign(playerAngleV) * 0.12;
  playerAngle += playerAngleV;

  // Speed and distance
  speed += 0.0005;
  distance += speed;
  tunnelOffset = (tunnelOffset + speed) % RING_SPACING;

  // Spawn obstacles ahead
  while (nextObstacleZ < distance + 60) {
    // The obstacle Z in world: it's placed far ahead, and as `distance` grows it
    // moves closer to z=0 (camera position).
    makeObstacle(-(nextObstacleZ - distance));
    nextObstacleZ += 8 + Math.random() * 6;
  }

  // Move obstacles toward camera
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.position.z += speed;
    if (o.position.z > 5) {
      scene.remove(o);
      obstacles.splice(i, 1);
      continue;
    }
    // Collision at z=0
    if (o.position.z > -0.8 && o.position.z < 0.8) {
      const diff = Math.abs(angleDiff(playerAngle, o.userData.angle));
      if (diff < o.userData.arc / 2 + 0.15) {
        return die();
      }
    }
  }

  // Rotate the tunnel so the player angle appears at the bottom of the view.
  // We want playerAngle's location to render at world angle = -PI/2.
  // So we rotate the scene around Z by (-PI/2 - playerAngle).
  const rotZ = -Math.PI / 2 - playerAngle;
  tunnelGroup.rotation.z = rotZ;
  for (const o of obstacles) o.rotation.z = rotZ;

  // Scroll the tunnel: shift it so rings appear to come toward us.
  // We move tunnelGroup forward, but wrap modulo RING_SPACING so it loops infinitely.
  tunnelGroup.position.z = tunnelOffset;

  // Camera bob and slight roll for vertigo feel
  const roll = -playerAngleV * 5;
  camera.position.set(0, 0, 0);
  camera.rotation.set(0, 0, roll);

  // Ball: render at the bottom center of view, with a small bounce
  const bounce = Math.sin(frame * 0.4) * 0.05;
  ballWire.position.set(0, -TUNNEL_RADIUS + 1.2 + bounce, -5);
  // Counter-rotate the ball to undo the camera roll so it stays upright visually
  ballWire.rotation.z = -roll;
  // Spin the ball for rolling effect
  ballWire.rotation.x += speed * 0.2;

  // HUD
  scoreEl.textContent = Math.floor(distance * 5);
  spdEl.textContent = (speed / 0.35).toFixed(1) + 'x';
}

function die() {
  state = 'dead';
  const score = Math.floor(distance * 5);
  if (score > best) {
    best = score;
    localStorage.setItem('slopeBestV3', best);
    bestEl.textContent = best;
  }
  overlay.style.display = 'flex';
  document.querySelector('#overlay h2').textContent = 'GAME OVER';
  document.querySelector('#overlay p').textContent =
    `Score: ${score} — Best: ${best}`;
  startBtn.textContent = 'TRY AGAIN';
}

function loop() {
  if (state === 'playing') update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

// Resize
window.addEventListener('resize', () => {
  const s = getSize();
  W = s.w; H = s.h;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});
</script>

</body>
</html>
