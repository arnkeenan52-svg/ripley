<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markus Arcade</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background:
      radial-gradient(ellipse at top left, rgba(255, 0, 128, 0.15) 0%, transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(41, 173, 255, 0.15) 0%, transparent 50%),
      #0a0014;
    min-height: 100vh;
    font-family: 'VT323', monospace;
    color: #fff;
    overflow-x: hidden;
  }
  body { padding: 40px 20px; min-height: 100vh; }
  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(24px, 6vw, 56px);
    text-align: center; letter-spacing: 3px;
    background: linear-gradient(90deg, #ff004d 0%, #ff8500 20%, #ffec27 40%, #00e436 60%, #29adff 80%, #ff77a8 100%);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rainbow 4s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes rainbow { to { background-position: 200% center; } }
  .subtitle {
    text-align: center; font-size: 24px; color: #ffec27;
    letter-spacing: 6px; margin-bottom: 50px; opacity: 0.9;
  }
  .grid {
    max-width: 1100px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
  }
  .card {
    position: relative; background: #14002a; border: 3px solid;
    border-radius: 12px; padding: 30px 24px;
    text-decoration: none; color: #fff; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    overflow: hidden; text-align: center; display: block;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, var(--glow), transparent 70%);
    opacity: 0.3; pointer-events: none;
  }
  .card:hover { transform: translateY(-6px) scale(1.02); }
  .card:nth-child(1) { border-color: #ffec27; --glow: #ffec27; }
  .card:nth-child(2) { border-color: #00e436; --glow: #00e436; }
  .card:nth-child(3) { border-color: #ff77a8; --glow: #ff77a8; }
  .card:nth-child(4) { border-color: #29adff; --glow: #29adff; }
  .card:nth-child(5) { border-color: #ff004d; --glow: #ff004d; }
  .card:nth-child(1):hover { box-shadow: 0 0 40px rgba(255, 236, 39, 0.6); }
  .card:nth-child(2):hover { box-shadow: 0 0 40px rgba(0, 228, 54, 0.6); }
  .card:nth-child(3):hover { box-shadow: 0 0 40px rgba(255, 119, 168, 0.6); }
  .card:nth-child(4):hover { box-shadow: 0 0 40px rgba(41, 173, 255, 0.6); }
  .card:nth-child(5):hover { box-shadow: 0 0 40px rgba(255, 0, 77, 0.6); }
  .icon { font-size: 60px; margin-bottom: 16px; display: block; filter: drop-shadow(0 0 12px var(--glow)); }
  .game-name { font-family: 'Press Start 2P', monospace; font-size: 16px; color: #fff; margin-bottom: 12px; letter-spacing: 1px; }
  .game-tagline { font-size: 20px; letter-spacing: 1px; min-height: 50px; display: flex; align-items: center; justify-content: center; }
  .card:nth-child(1) .game-tagline { color: #ffec27; }
  .card:nth-child(2) .game-tagline { color: #00e436; }
  .card:nth-child(3) .game-tagline { color: #ff77a8; }
  .card:nth-child(4) .game-tagline { color: #29adff; }
  .card:nth-child(5) .game-tagline { color: #ff004d; }
  .play-btn { margin-top: 16px; font-family: 'Press Start 2P', monospace; font-size: 11px; color: #000; background: #fff; padding: 8px 16px; border-radius: 4px; display: inline-block; }
  footer { text-align: center; margin-top: 60px; font-size: 18px; color: #555; }
</style>
</head>
<body>
<h1>MARKUS ARCADE</h1>
<div class="subtitle">★ 5 GAMES ★</div>
<div class="grid">
  <a class="card" href="pacman.html">
    <span class="icon">😋</span>
    <div class="game-name">PAC-MAN</div>
    <div class="game-tagline">Markus er clapped</div>
    <span class="play-btn">PLAY ▶</span>
  </a>
  <a class="card" href="slope.html">
    <span class="icon">🎿</span>
    <div class="game-name">SLOPE</div>
    <div class="game-tagline">Markus er milf enjoyer</div>
    <span class="play-btn">PLAY ▶</span>
  </a>
  <a class="card" href="slither.html">
    <span class="icon">🐍</span>
    <div class="game-name">SLITHER</div>
    <div class="game-tagline">Markus er ulækker</div>
    <span class="play-btn">PLAY ▶</span>
  </a>
  <a class="card" href="colorblind.html">
    <span class="icon">👁️</span>
    <div class="game-name">COLOR BLIND TEST</div>
    <div class="game-tagline">Markus er lort til slime rng</div>
    <span class="play-btn">PLAY ▶</span>
  </a>
  <a class="card" href="reaction.html">
    <span class="icon">⚡</span>
    <div class="game-name">REACTION TEST</div>
    <div class="game-tagline">Markus er svag</div>
    <span class="play-btn">PLAY ▶</span>
  </a>
</div>
<footer>★ Tap a game to start ★</footer>
</body>
</html>
